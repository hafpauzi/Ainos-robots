<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Ainos Robot</title>
  <link rel="stylesheet" href="style.css">
</head>

  
<body>

<h1 class="page-title">Aino's Robot</h1>
  <style>
  @font-face {
    font-family: 'LowresPixel-Regular';
    src: url('LowresPixel-Regular.otf') format('truetype');
    }

    body {
    font-family: 'LowresPixel-Regular';
    text-align: center;
    }

     .container {
      margin-top: 100px;
    }
    
  </style>


<div class="main-layout">

  <div class="robot-container">
    <img src="square.png" class="square">

    <div class="robot">
      images/Body.png
      images/Idle ears.png
      images/Idle 1 up.png
    </div>
  </div>

  <div class="study-panel">
    <img id="bubble" src="bubble.png" class="bubble">

    <div id="study-timer">
      <div id="timer-display">30:00</div>

      <button onclick="startTimer()">▶</button>
      <button onclick="pauseTimer()">⏸</button>
      <button onclick="resetTimer()">↺</button>
    </div>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
